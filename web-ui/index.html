<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Addon Picker</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --bg-panel: #16213e;
        --bg-card: #0f3460;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --accent: #e94560;
        --border: #334155;
        --essential: #ef4444;
        --recommended: #f59e0b;
        --optional: #3b82f6;

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;

      #root { min-height: 100vh; }

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
